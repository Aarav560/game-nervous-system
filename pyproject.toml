[project]
name = "game-nervous-system"
version = "0.0.1"
description = "Brain (LLM) + nervous system (Laya) + reflexes for real-time game AI"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "pyyaml>=6"]

[project.optional-dependencies]
# CPU-only machines: install torch from https://download.pytorch.org/whl/cpu first.
laya = ["laya>=0.4", "torch", "transformers"]
dev = ["pytest>=8", "jsonschema>=4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
